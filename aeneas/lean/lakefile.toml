name = "qsag_aeneas"
version = "0.1.0"
defaultTargets = ["Aeneas", "QsagVerified", "QsagMirProofs", "QsagSpecWeld", "AuditMirAxioms"]

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "Aeneas"

[[lean_lib]]
name = "QsagVerified"

[[lean_lib]]
name = "QsagMirProofs"

[[lean_lib]]
name = "QsagVerifiedChallenge"

[[lean_lib]]
name = "AuditMirAxioms"

# Cross-package welds and their axiom census are mandatory default targets.
[[lean_lib]]
name = "QsagSpecWeld"

[[require]]
name = "qsag"
path = "../../lean"
