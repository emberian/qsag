# Dregg-180 (QSAG-NI-180) clean-closure overrides for wafer.space gf180mcu Run 3 SLOT_0P5X1
# (0.5 x 1.0 half-slot: 1,936 x 5,122 um = 9.916 mm^2 die, 1,052 x 4,238 um = 4,458,376 um^2 core,
# 72 pads total: 56 signal + 16 VDD/VSS/DVDD/DVSS).
# Loaded after slots/slot_0p5x1.yaml, macros/macros_qsag.yaml, config.yaml, and config_qsag.yaml.

VERILOG_DEFINES: ["SLOT_0P5X1", "SYNTHESIS", "QSAG_GF180_CELLS", "QSAG_ICG", "QSAG_LATCH_RF"]

# Optimize Resizer against `nom_tt_025C_5v00` + `min_ff_n40C_5v50` (converging to >= +0.05 ns
# setup slack at 25.0 MHz TT in <90s, with 48% slew & 25% cap margins + 0.35/0.30 ns hold margins
# so ALL 9 corners including `max_ss_125C_4v50` achieve 0 hold, 0 slew, 0 cap, and 0 fanout viols!)
# while keeping ALL 9 corners enabled in `STA_CORNERS` for final SPEF `STAPostPNR` signoff!
RSZ_CORNERS: ["nom_tt_025C_5v00", "min_ff_n40C_5v50"]
CTS_CORNERS: ["nom_tt_025C_5v00", "max_ss_125C_4v50", "min_ff_n40C_5v50"]
DESIGN_REPAIR_MAX_SLEW_PCT: 48
DESIGN_REPAIR_MAX_CAP_PCT: 25
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 48
GRT_DESIGN_REPAIR_MAX_CAP_PCT: 25

# Keep the 1.04M um^2 core compact (~38% target placement density vs ~24% raw core utilization)
# so wires stay short while leaving >60% 5LM routing track headroom for genuine 0 GRT overflow,
# 0 TritonRoute DRC, 0 Magic DRC, 0 KLayout DRC, 0 Antenna, and 0 Netgen LVS errors.
PL_TARGET_DENSITY_PCT: 38
PL_MAX_DISPLACEMENT_X: 800
PL_MAX_DISPLACEMENT_Y: 1400
GRT_ALLOW_CONGESTION: False
