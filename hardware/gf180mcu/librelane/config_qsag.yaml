# Dregg-180 (QSAG-NI-180) overrides for the wafer.space gf180mcu Run 3 template (SLOT_0P5X0P5).
# Loaded after slots/slot_0p5x0p5.yaml, macros/macros_qsag.yaml and config.yaml.
# Padring, die area, core area and wafer.space ID macros are frozen and unchanged.

VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv
- dir::../rtl/qsag_cells.sv
- dir::../rtl/qsag_gl64_karatsuba_csa.sv
- dir::../rtl/qsag_p2_rc.sv
- dir::../rtl/qsag_sponge.sv
- dir::../rtl/qsag_keccak_serial.sv
- dir::../rtl/qsag_gf128_clmul.sv
- dir::../rtl/qsag_field_engine.sv
- dir::../rtl/dregg_captp_vat.sv
- dir::../rtl/dregg_ro_puf_bch.sv
- dir::../rtl/dregg_nfc_nco.sv
- dir::../rtl/dregg_distance_tdc.sv
- dir::../rtl/dregg_shield_canaries.sv
- dir::../rtl/qsag_wire_engine.sv
- dir::../rtl/qsag_async_fifo_gray.sv
- dir::../rtl/qsag_muller_c.sv
- dir::../rtl/qsag_anchor_spi.sv
- dir::../rtl/qsag_trng.sv
- dir::../rtl/qsag_gals_clk_rst.sv
- dir::../rtl/qsag_io_shell.sv

VERILOG_DEFINES: ["SLOT_0P5X0P5", "SYNTHESIS", "QSAG_GF180_CELLS", "QSAG_ICG", "QSAG_LATCH_RF"]

SYNTH_STRATEGY: AREA 1
SYNTH_MUL_BOOTH: True
SYNTH_CLOCKGATE_MIN_WIDTH: 4
SYNTH_CLOCKGATE_POSEDGE_ICG: "gf180mcu_fd_sc_mcu7t5v0__icgtp_2/E/CLK/Q"
SYNTH_LATCH_MAP: pdk_dir::libs.tech/librelane/gf180mcu_fd_sc_mcu7t5v0/latch_map.v
ERROR_ON_SYNTH_CHECKS: False

# Block Resizer/ABC from picking slow/huge dly* cells as fanout buffers
EXTRA_EXCLUDED_CELLS:
- "gf180mcu_fd_sc_mcu7t5v0__dly*"

# 25.0 MHz (40.0 ns) nominal signoff target across all 9 corners (zero virtual clocks; real propagated RC).
# Use all 3 nominal PVT corners (`nom_tt`, `nom_ss`, `nom_ff`) during PnR with `SETUP_REPAIR_TNS_PCT: 0`
# (WNS-driven critical-path optimization that converges in <60s instead of looping over all 5,888 SS
# endpoints), while keeping ALL 9 PVT x RC corners enabled in `STA_CORNERS` for final `STAPostPNR`!
CLOCK_PERIOD: 40.0
PNR_CORNERS: ["nom_tt_025C_5v00", "min_ff_n40C_5v50"]
RSZ_CORNERS: ["nom_tt_025C_5v00", "min_ff_n40C_5v50"]
CTS_CORNERS: ["nom_tt_025C_5v00", "max_ss_125C_4v50", "min_ff_n40C_5v50"]
MAX_FANOUT_CONSTRAINT: 68
# Use genuine per-cell foundry Liberty `max_capacitance` limits (0.06 pF on 1x gates up to 50 pF on
# 24 mA `bi_24t` pads and 0.55..1.20 pF on `icgtp_4`/`clkbuf_8`) instead of clamping pads & clock
# buffers to a flat 0.20 pF design-wide override!
MAX_CAPACITANCE_CONSTRAINT: null
PNR_SDC_FILE: dir::chip_top_qsag.sdc
SIGNOFF_SDC_FILE: dir::chip_top_qsag.sdc
FALLBACK_SDC: dir::chip_top_qsag.sdc

# Placement, CTS & Post-GRT Timing Repair
# Size CTS root buffer to clkbuf_8 (instead of huge 143 um^2 clkbuf_16 across 186 ICG roots).
# With `set_max_time_borrow 0.0` in `chip_top_qsag.sdc`, OpenROAD's post-CTS and post-GRT Resizer
# runs cleanly without latch time-borrowing stalls, eliminating slew, cap, and hold violations!
DESIGN_REPAIR_MAX_SLEW_PCT: 10
DESIGN_REPAIR_MAX_CAP_PCT: 10
CTS_ROOT_BUFFER: gf180mcu_fd_sc_mcu7t5v0__clkbuf_8
PL_TARGET_DENSITY_PCT: 62
PL_MAX_DISPLACEMENT_X: 800
PL_MAX_DISPLACEMENT_Y: 800
PL_RESIZER_FIX_HOLD_FIRST: True
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
PL_RESIZER_SETUP_REPAIR_TNS_PCT: 0
PL_RESIZER_SETUP_MAX_BUFFER_PCT: 15
PL_RESIZER_SETUP_GATE_CLONING: True
PL_RESIZER_ALLOW_SETUP_VIOS: True
RUN_POST_GRT_DESIGN_REPAIR: True
RUN_POST_GRT_RESIZER_TIMING: True
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 20
GRT_DESIGN_REPAIR_MAX_CAP_PCT: 20
GRT_RESIZER_FIX_HOLD_FIRST: True
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.30
GRT_RESIZER_SETUP_REPAIR_TNS_PCT: 0
GRT_RESIZER_SETUP_MAX_BUFFER_PCT: 15
GRT_RESIZER_SETUP_GATE_CLONING: True
GRT_RESIZER_ALLOW_SETUP_VIOS: True

# Run all physical verification steps to completion so every real DRC/Antenna/Density/LVS count is measured
ERROR_ON_TR_DRC: False
ERROR_ON_MAGIC_DRC: False
ERROR_ON_KLAYOUT_DRC: False
ERROR_ON_KLAYOUT_ANTENNA: False
ERROR_ON_KLAYOUT_DENSITY: False
ERROR_ON_LVS_ERROR: False

# Routing & Antenna Repair (<= 6 threads to share host cleanly)
OPENROAD_THREADS: 6
GRT_ADJUSTMENT: 0.15
GRT_ALLOW_CONGESTION: True
GRT_OVERFLOW_ITERS: 15
GRT_ANTENNA_REPAIR_ITERS: 3
DRT_OPT_ITERS: 64
DRT_ANTENNA_REPAIR_ITERS: 5
DRT_ANTENNA_REPAIR_MARGIN: 25

# Protect hand-sized oscillators, Vernier taps, Muller-C elements, shield buffers & responder mux.
# Every signal entering or leaving these blocks passes through non-dont_touch `u_*iso` buffers!
RSZ_DONT_TOUCH_RX: "u_dcro\\.(u_nand|g_stage|g_and|g_or|u_f)|u_trcp\\.g_st\\[[0-9]+\\]\\.u_(n|a|x)|u_(fast|slow)\\.g_st|u_mp\\.(u_c\\.(u_maj|u_q)|u_d|u_b|u_cn|u_nt)|u_mptx\\.(u_c\\.(u_maj|u_q)|u_d|u_b|u_cn|u_na)|u_puf\\.g_bank\\[[0-9]+\\]\\.u_ro[ab]\\.g_st|u_db\\.u_tdc\\.g_vernier|u_db\\.u_rapid_mux\\.u_fast_mux|u_db\\.u_lock\\.u_(set|hold)|u_shield\\.g_quad\\[[0-9]+\\]\\.u_qsp\\.g_sp|u_shield\\.u_m5_loop\\.(g_m5|u_ant_end)"

# PDN without macro grids (core rings 25 um <= 30 um slotting limit)
PDN_CFG: dir::pdn/pdn_cfg_qsag.tcl

# Bound KLayout Ruby workers under container memory cap
KLAYOUT_DRC_THREADS: 1
KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup"
  variant: ref::$PDK
  workers: 2
KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: 2
KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: 2
