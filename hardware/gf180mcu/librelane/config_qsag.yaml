# Dregg-180 (QSAG-NI-180) overrides for the wafer.space gf180mcu Run 3 template (SLOT_0P5X0P5).
# Loaded after slots/slot_0p5x0p5.yaml, macros/macros_qsag.yaml and config.yaml.
# Padring, die area, core area and wafer.space ID macros are frozen and unchanged.

VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv
- dir::../rtl/qsag_cells.sv
- dir::../rtl/qsag_gl64_karatsuba_csa.sv
- dir::../rtl/qsag_p2_rc.sv
- dir::../rtl/qsag_sponge.sv
- dir::../rtl/qsag_keccak_serial.sv
- dir::../rtl/qsag_gf128_clmul.sv
- dir::../rtl/qsag_field_engine.sv
- dir::../rtl/dregg_captp_vat.sv
- dir::../rtl/dregg_ro_puf_bch.sv
- dir::../rtl/dregg_nfc_nco.sv
- dir::../rtl/dregg_distance_tdc.sv
- dir::../rtl/dregg_shield_canaries.sv
- dir::../rtl/qsag_wire_engine.sv
- dir::../rtl/qsag_async_fifo_gray.sv
- dir::../rtl/qsag_muller_c.sv
- dir::../rtl/qsag_anchor_spi.sv
- dir::../rtl/qsag_trng.sv
- dir::../rtl/qsag_gals_clk_rst.sv
- dir::../rtl/qsag_io_shell.sv

VERILOG_DEFINES: ["SLOT_0P5X0P5", "QSAG_GF180_CELLS", "QSAG_ICG"]

# Synthesis (`DELAY 0` avoids ABC `dch` area inflation on gf180mcu 7t5v0; restore latch_map)
SYNTH_STRATEGY: DELAY 0
SYNTH_MUL_BOOTH: True
SYNTH_LATCH_MAP: pdk_dir::libs.tech/librelane/gf180mcu_fd_sc_mcu7t5v0/latch_map.v
ERROR_ON_SYNTH_CHECKS: False

# Subcarbon R0 Trap T4: block Resizer/ABC from picking slow/huge dly* cells as fanout buffers
EXTRA_EXCLUDED_CELLS:
- "gf180mcu_fd_sc_mcu7t5v0__dly*"

# Timing (50 MHz = 20 ns target across TT/SS/FF; 3 CTS trees in chip_top_qsag.sdc)
CLOCK_PERIOD: 20
MAX_FANOUT_CONSTRAINT: 40
MAX_TRANSITION_CONSTRAINT: 1.5
PNR_SDC_FILE: dir::chip_top_qsag.sdc
SIGNOFF_SDC_FILE: dir::chip_top_qsag.sdc
FALLBACK_SDC: dir::chip_top_qsag.sdc

# Placement & Post-GRT Hold Repair
PL_TARGET_DENSITY_PCT: 62
PL_MAX_DISPLACEMENT_X: 800
PL_MAX_DISPLACEMENT_Y: 800
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
RUN_POST_GRT_RESIZER_TIMING: True
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.55

# Routing & Antenna Repair (Subcarbon R0 Traps 2 & 4)
GRT_OVERFLOW_ITERS: 3
DRT_THREADS: 8
DRT_ANTENNA_REPAIR_ITERS: 15
DRT_ANTENNA_REPAIR_MARGIN: 25

# Protect hand-sized oscillators, Vernier taps, Muller-C elements, shield buffers & responder mux
# (Upstream nets pass through non-dont_touch `u_*iso` buffers so RSZ-3006 never fires!)
RSZ_DONT_TOUCH_RX: "u_dcro\\.(u_nand|g_stage|g_and|g_or|u_f)|u_trcp\\.g_st|u_(fast|slow)\\.g_st|u_mp\\.(u_c|u_d|u_b|u_cn|u_nt)|u_mptx\\.(u_c|u_d|u_b|u_cn|u_na)|u_clk\\.u_mux\\.u_(ga|gb|o|ia|ib)|u_puf\\.g_bank\\[[0-9]+\\]\\.u_ro[ab]\\.g_st|u_db\\.u_tdc\\.g_vernier|u_db\\.u_rapid_mux\\.u_fast_mux|u_shield\\.g_quad\\[[0-9]+\\]\\.u_qsp\\.g_sp|u_shield\\.u_m5_loop\\.(g_m5|u_ant_end)"

# PDN without macro grids (core rings 25 um <= 30 um slotting limit)
PDN_CFG: dir::pdn/pdn_cfg_qsag.tcl

# Bound KLayout Ruby workers under 16 GiB container cap
KLAYOUT_DRC_THREADS: 1
KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup"
  variant: ref::$PDK
  workers: 2
KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: 2
KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: 2
