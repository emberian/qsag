# Dregg-180 v2 physical-design proxy: LibreLane overlay, loaded last:
#   librelane librelane/slots/slot_0p5x0p5.yaml librelane/macros/macros_qsag.yaml librelane/config.yaml \
#             librelane/config_phys.yaml ...
# `tools/sync.sh` copies this file to <remote project>/librelane/config_phys.yaml, because LibreLane
# resolves `dir::` against the design directory (librelane/), not against this file's own directory.
# Pad ring, die area, core area and the wafer.space ID macros come from the template files, unchanged.

VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../v2/phys/proxy/chip_core_proxy.sv
- dir::../v2/phys/proxy/px_rf.sv
- dir::../v2/phys/proxy/px_rom.sv          # generated: python3 gen_rom.py 1700 28 ucode
- dir::../v2/phys/proxy/px_seq3.sv
- dir::../v2/phys/proxy/px_wu3.sv
- dir::../v2/phys/proxy/px_spi.sv
- dir::../v2/phys/proxy/px_clkmon.sv
- dir::../v2/phys/proxy/px_nfc.sv
- dir::../v2/phys/proxy/px_puf_array.sv
- dir::../v2/phys/proxy/px_trng8.sv
- dir::../rtl/qsag_cells.sv
- dir::../v2/phys/proxy/qsag_p2_rc.sv     # generated: scripts/gen_p2_rc.py (holds qsag_keccak_rc)
- dir::../rtl/qsag_keccak_serial.sv
- dir::../rtl/dregg_ro_puf_bch.sv
- dir::../rtl/dregg_nfc_nco.sv
- dir::../rtl/dregg_distance_tdc.sv
- dir::../rtl/dregg_shield_canaries.sv
- dir::../rtl/qsag_anchor_spi.sv
- dir::../rtl/qsag_trng.sv

VERILOG_DEFINES: ["SLOT_0P5X0P5", "SYNTHESIS", "QSAG_GF180_CELLS", "QSAG_ICG", "QSAG_LATCH_RF"]

# Hierarchy is kept: block regions and the array placement need instance paths that survive synthesis.
SYNTH_HIERARCHY_MODE: keep
SYNTH_STRATEGY: AREA 2
SYNTH_DIRECT_WIRE_BUFFERING: false
SYNTH_LATCH_MAP: pdk_dir::libs.tech/librelane/gf180mcu_fd_sc_mcu7t5v0/latch_map.v
ERROR_ON_SYNTH_CHECKS: False
EXTRA_EXCLUDED_CELLS:
- "gf180mcu_fd_sc_mcu7t5v0__dly*"

CLOCK_PERIOD: 40          # 25 MHz
MAX_FANOUT_CONSTRAINT: 40
PNR_SDC_FILE: dir::chip_top_phys.sdc
SIGNOFF_SDC_FILE: dir::chip_top_phys.sdc
FALLBACK_SDC: dir::chip_top_phys.sdc

PL_TARGET_DENSITY_PCT: 62
PDN_CFG: dir::pdn/pdn_cfg_qsag.tcl
# Vertical supply straps every two PUF slots (2 x 43 sites x 0.56 um), so that every strap crosses every
# slot pair of the PUF array at the same x (physics/puf/placement_requirements.md R4.2). Template: 75.
PDN_VPITCH: 48.16
