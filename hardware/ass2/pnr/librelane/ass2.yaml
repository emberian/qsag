VERILOG_FILES: [dir::../src/chip_top.sv, dir::../mapped/mapped.v]
VERILOG_DEFINES: [SLOT_0P5X0P5, PAD_gf180mcu_fd_io]
RUN_LINTER: false
ERROR_ON_SYNTH_CHECKS: false
PNR_SDC_FILE: dir::ass2_pnr.sdc
SIGNOFF_SDC_FILE: dir::ass2.sdc
FALLBACK_SDC: dir::ass2.sdc
CLOCK_PORT: [clk_PAD, 'bidir_PAD[18]']
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 40.0
PNR_CORNERS: [nom_tt_025C_5v00, min_ff_n40C_5v50, max_ss_125C_4v50]
STA_CORNERS: [nom_tt_025C_5v00, nom_ff_n40C_5v50, nom_ss_125C_4v50, min_tt_025C_5v00, min_ff_n40C_5v50, min_ss_125C_4v50, max_tt_025C_5v00, max_ff_n40C_5v50, max_ss_125C_4v50]
OPENROAD_THREADS: 8

# Exclude slow/large delay cells; enforce genuine foundry Liberty pin cap limits & 68-pin row fanout limit
EXTRA_EXCLUDED_CELLS:
- "gf180mcu_fd_sc_mcu7t5v0__dly*"
MAX_FANOUT_CONSTRAINT: 68
MAX_CAPACITANCE_CONSTRAINT: null

# Protect internal feedback stages of all 514 physical ring oscillators (512 PUF + 2 CoSO TRNG)
RSZ_DONT_TOUCH_RX: "i_chip_core\\.u_puf\\.g_grp.*\\.u_ro[ab]\\.stage\\[[0-9]+\\]|i_chip_core\\.u_trng\\.u_(fast|slow)\\.stage\\[[0-9]+\\]"

# Macro halos & placement density discipline on SLOT_0P5X0P5 (`0` GRT overflow, `0` DRT DRC)
FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10
PL_TARGET_DENSITY_PCT: 65
PL_MAX_DISPLACEMENT_X: 800
PL_MAX_DISPLACEMENT_Y: 800
CTS_ROOT_BUFFER: gf180mcu_fd_sc_mcu7t5v0__clkbuf_4
CTS_CLK_BUFFERS:
- gf180mcu_fd_sc_mcu7t5v0__clkbuf_2
- gf180mcu_fd_sc_mcu7t5v0__clkbuf_4
CTS_APPLY_NDR: root_only
GRT_ALLOW_CONGESTION: false
DIODE_ON_PORTS: both
GRT_ADJUSTMENT: 0.05
GRT_OVERFLOW_ITERS: 25
GRT_ANTENNA_REPAIR_ITERS: 10
DRT_OPT_ITERS: 64
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 20

# Slew/cap/fanout + setup/hold repair across all 9 corners (`ERROR_ON_* = true`)
DESIGN_REPAIR_MAX_SLEW_PCT: 20
DESIGN_REPAIR_MAX_CAP_PCT: 20
PL_RESIZER_FIX_HOLD_FIRST: true
PL_RESIZER_HOLD_SLACK_MARGIN: 0.30
PL_RESIZER_SETUP_REPAIR_TNS_PCT: 0
PL_RESIZER_SETUP_MAX_BUFFER_PCT: 15
PL_RESIZER_SETUP_GATE_CLONING: true
PL_RESIZER_ALLOW_SETUP_VIOS: false
RUN_POST_GRT_DESIGN_REPAIR: true
RUN_POST_GRT_RESIZER_TIMING: true
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 15
GRT_DESIGN_REPAIR_MAX_CAP_PCT: 15
GRT_RESIZER_FIX_HOLD_FIRST: true
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.25
GRT_RESIZER_SETUP_REPAIR_TNS_PCT: 0
GRT_RESIZER_SETUP_MAX_BUFFER_PCT: 15
GRT_RESIZER_SETUP_GATE_CLONING: true
GRT_RESIZER_ALLOW_SETUP_VIOS: false

ERROR_ON_TR_DRC: true
ERROR_ON_MAGIC_DRC: true
ERROR_ON_KLAYOUT_DRC: true
ERROR_ON_KLAYOUT_ANTENNA: true
ERROR_ON_KLAYOUT_DENSITY: true
ERROR_ON_LVS_ERROR: true
ERROR_ON_PDN_VIOLATIONS: true
RUN_IRDROP_REPORT: true

IGNORE_DISCONNECTED_MODULES: [gf180mcu_fd_io__bi_t, gf180mcu_fd_io__in_c, gf180mcu_fd_io__in_s, gf180mcu_ws_ip__qrcode_id, gf180mcu_ws_ip__shuttle_id, gf180mcu_ws_ip__project_id, gf180mcu_ws_ip__logo, gf180mcu_ws_ip__marker]
KLAYOUT_DRC_THREADS: 1
KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup"
  variant: ref::$PDK
  workers: 2
KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: 2
KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: 2
