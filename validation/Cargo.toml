[workspace]
resolver = "2"

[package]
name = "qsag-external-validation"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false
description = "External differential validation, property-based testing (proptest), NIST ACVP KATs, and Lean 4 executable spec-oracle suite for QSAG."

[features]
default = ["quorum"]
quorum = ["dep:qsag-quorum"]

[dependencies]
# Internal QSAG crates under differential audit (kept zero-dependency in root workspace)
qsag-core = { path = "../crates/qsag-core", features = ["std"] }
qsag-asm = { path = "../crates/qsag-asm", features = ["std"] }
qsag-agg = { path = "../crates/qsag-agg", features = ["std"] }
qsag-accel = { path = "../crates/qsag-accel", features = ["std"] }
qsag-cred = { path = "../crates/qsag-cred", features = ["std"] }
qsag-addr = { path = "../crates/qsag-addr", features = ["std"] }
qsag-fts = { path = "../crates/qsag-fts", features = ["std"] }
qsag-policy = { path = "../crates/qsag-policy", features = ["std"] }
qsag-hd = { path = "../crates/qsag-hd", features = ["std"] }
qsag-migrate = { path = "../crates/qsag-migrate", features = ["std"] }
qsag-ass2 = { path = "../crates/qsag-ass2" }
qsag-quorum = { path = "../crates/qsag-quorum", features = ["std", "testing-ephemeral"], optional = true }

# Property-based testing & serialization
proptest = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

# Independent NIST FIPS 205 (SLH-DSA) & FIPS 204 (ML-DSA) implementations
fips205 = "0.4"
fips204 = "0.4"

# Independent Sponge & Hash implementations
sha3 = "0.10"
tiny-keccak = { version = "2.0", features = ["keccak", "sha3", "shake", "cshake", "sp800"] }
sha2 = "0.10"
hmac = "0.12"
ripemd = "0.1"
blake3 = "1.5"

# Independent Finite-Field & Polynomial implementations (Plonky3 Goldilocks + POLYVAL/GHASH)
p3-field = "0.2"
p3-goldilocks = "0.2"
p3-dft = "0.2"
polyval = "0.6"
ghash = "0.5"

# Independent Elliptic Curve implementations (secp256k1, Ed25519, Pallas, BLS12-381)
k256 = { version = "0.13", features = ["arithmetic", "ecdsa", "schnorr", "expose-field"] }
ed25519-dalek = { version = "2.1", features = ["hazmat", "digest"] }
curve25519-dalek = "4.1"
pasta_curves = "0.5"
group = "0.13"
ff = "0.13"
blstrs = "0.7"

[profile.test]
opt-level = 3
debug-assertions = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
