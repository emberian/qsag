[package]
name = "qsag-hd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Committed signature-key inventories and distributed child-seed custody."

[features]
default = ["alloc"]
alloc = ["qsag-accel/alloc", "qsag-addr/alloc"]
std = ["qsag-core/std", "qsag-asm/std", "alloc", "qsag-accel/std", "qsag-addr/std"]
# Nonpersistent custody shortcuts (in-memory poison journal, unchecked child-seed
# reconstruction) for protocol tests. Never enable in a custody build.
testing-ephemeral = []

[dependencies]
qsag-verified = { path = "../../aeneas/qsag-verified", default-features = false }
qsag-asm = { path = "../qsag-asm", default-features = false, features = ["alloc"] }
qsag-core = { path = "../qsag-core", default-features = false }
qsag-accel = { path = "../qsag-accel", default-features = false }
qsag-addr = { path = "../qsag-addr", default-features = false }
