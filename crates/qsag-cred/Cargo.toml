rust-version.workspace = true
description = "Threshold PQ Verifiable Credentials, 2-Round Lattice VOPRF, Unlinkable Selective Disclosure, & Dealerless Standard-Verifier FIPS 204 Threshold ML-DSA"

[dependencies]
qsag-verified = { path = "../../aeneas/qsag-verified", default-features = false }
