[package]
name = "qsag-cli"
description = "Command-line key generation, signing, verification, aggregation, address, policy and KAT tool for qsag, plus runnable examples."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "qsag"
path = "src/main.rs"

[dependencies]
# Strictly zero external crates.io dependencies.
qsag-accel = { path = "../qsag-accel", features = ["std"] }
qsag-addr = { path = "../qsag-addr", features = ["std"] }
qsag-agg = { path = "../qsag-agg", features = ["std"] }
qsag-asm = { path = "../qsag-asm", features = ["std"] }
qsag-core = { path = "../qsag-core", features = ["std"] }
qsag-cred = { path = "../qsag-cred", features = ["std"] }
qsag-fts = { path = "../qsag-fts", features = ["std"] }
qsag-hd = { path = "../qsag-hd", features = ["std"] }
qsag-migrate = { path = "../qsag-migrate", features = ["std"] }
qsag-policy = { path = "../qsag-policy", features = ["std"] }
qsag-quorum = { path = "../qsag-quorum", features = ["std"] }

[dev-dependencies]
# Unit tests provision `fts-threshold` shares with the trusted dealer; the shipped binary never does.
qsag-fts = { path = "../qsag-fts", features = ["std", "test-dealer"] }

[features]
default = []
test-dealer = ["qsag-fts/test-dealer", "qsag-policy/test-dealer"]
