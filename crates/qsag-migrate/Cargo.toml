[package]
name = "qsag-migrate"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Mixed-domain ZKBoo migration ownership with replicated and authenticated general-quorum outer-MPC proving"

[features]
default = ["alloc"]
alloc = ["qsag-accel/alloc", "qsag-addr/alloc"]
std = ["alloc", "qsag-accel/std", "qsag-addr/std", "qsag-core/std"]
vulkan = ["std"]
# Deterministic single-seed preprocessing for tests and benchmarks. A build with
# this feature contains a generator that knows every MAC key; never ship it.
test-dealer = []

[dependencies]
qsag-core = { path = "../qsag-core", default-features = false }
qsag-asm = { path = "../qsag-asm", default-features = false }
qsag-accel = { path = "../qsag-accel", default-features = false }
qsag-addr = { path = "../qsag-addr", default-features = false }
