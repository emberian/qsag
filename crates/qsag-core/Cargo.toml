[package]
name = "qsag-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zero-dependency no_std post-quantum threshold hash-based signatures (NIST FIPS 205 SLH-DSA, Corduroy, Baggy, JortsPoseidon2) with dealerless preprocessing and identifiable abort."

[features]
default = []
std = ["qsag-asm/std"]

[dependencies]
qsag-verified = { path = "../../aeneas/qsag-verified", default-features = false }
# Strictly zero external crate dependencies.
qsag-asm = { path = "../qsag-asm", default-features = false }
