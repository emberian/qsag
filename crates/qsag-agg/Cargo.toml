[package]
name = "qsag-agg"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Hem post-quantum K-to-1 hash signature aggregation over Quintic Goldilocks Fp5: multilinear sumcheck with WHIR rate-escalated Canopy multiproofs and [DKT26] recursive IVC"

[features]
default = ["std"]
alloc = []
std = ["alloc", "qsag-asm/std", "qsag-core/std"]
vulkan = ["std", "dep:qsag-accel", "qsag-accel/vulkan"]

[dependencies]
qsag-cred = { path = "../qsag-cred", default-features = false }
qsag-core = { path = "../qsag-core", default-features = false }
qsag-accel = { path = "../qsag-accel", optional = true, default-features = false }
qsag-asm = { path = "../qsag-asm", default-features = false }
qsag-whir-verified = { path = "../../aeneas/qsag-whir-verified", default-features = false }

[dev-dependencies]
# Reference implementation whose internal matrix is analysed by its own unit tests.
qsag-accel = { path = "../qsag-accel" }
qsag-core = { path = "../qsag-core", features = ["std"] }
qsag-fts = { path = "../qsag-fts", features = ["std"] }
qsag-quorum = { path = "../qsag-quorum", features = ["std"] }

[[example]]
name = "mock_solana_alpenglow"
required-features = ["std"]

[[example]]
name = "mock_ethereum_beam"
required-features = ["std"]
