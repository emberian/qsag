[package]
name = "qsag-fts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Post-quantum compact few-time hash signatures: constant-time bijective FrontierSumFts (514B / 770B / 1314B / 256-bit profiles) and experimental height-independent 48-round bijective x^7 SPN MPC ParallelSeededFts."

[features]
test-dealer = []
testing-ephemeral = ["qsag-core/testing-ephemeral"]
test-params = []
default = ["alloc"]
alloc = ["qsag-accel/alloc"]
std = ["qsag-core/std", "alloc", "qsag-accel/std"]

[dependencies]
qsag-asm = { path = "../qsag-asm", default-features = false }
qsag-verified = { path = "../../aeneas/qsag-verified", default-features = false }
qsag-core = { path = "../qsag-core", default-features = false }
qsag-accel = { path = "../qsag-accel", default-features = false }

[dev-dependencies]
qsag-core = { path = "../qsag-core", features = ["testing-ephemeral"] }
