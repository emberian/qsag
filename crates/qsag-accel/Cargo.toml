[package]
name = "qsag-accel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Zero-dependency no_std certified hardware/GPU accelerator trait, constant-time Goldilocks/GF(2^128)/Keccak/Poseidon2 CPU reference backend, and verified kernel digest registry."

[features]
default = ["alloc"]
alloc = []
std = ["alloc", "qsag-asm/std"]
# Select the live Linux Vulkan loader rather than the no_std unavailable stub.
vulkan = ["std"]
fault-injection-audit = ["std"]

[dependencies]
qsag-whir-verified = { path = "../../aeneas/qsag-whir-verified", default-features = false }
qsag-verified = { path = "../../aeneas/qsag-verified", default-features = false }
# Strictly zero external crates.io dependencies.
qsag-asm = { path = "../qsag-asm", default-features = false }
