[workspace]
resolver = "2"

[package]
name = "qsag-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.3", features = ["derive"] }

# Internal QSAG crates under hostile untrusted-wire & differential fuzzing
qsag-core = { path = "../crates/qsag-core", features = ["std"] }
qsag-asm = { path = "../crates/qsag-asm", features = ["std"] }
qsag-agg = { path = "../crates/qsag-agg", features = ["std"] }
qsag-accel = { path = "../crates/qsag-accel", features = ["std"] }
qsag-cred = { path = "../crates/qsag-cred", features = ["std"] }
# `test-dealer` exposes the trusted-dealer setup that produces the real threshold
# signature `fuzz_fips205_and_fts_decode` mutates.
qsag-fts = { path = "../crates/qsag-fts", features = ["std", "test-dealer"] }
qsag-policy = { path = "../crates/qsag-policy", features = ["std"] }
qsag-addr = { path = "../crates/qsag-addr", features = ["std"] }
qsag-quorum = { path = "../crates/qsag-quorum", features = ["std"] }

# Independent upstream reference implementations for coverage-guided differential fuzzing
sha3 = "0.10"
tiny-keccak = { version = "2.0", features = ["keccak", "sha3", "shake", "cshake", "sp800"] }
sha2 = "0.10"
ghash = "0.5"
p3-field = "0.2"
p3-goldilocks = "0.2"

[[bin]]
name = "fuzz_whir_agg_verify"
path = "fuzz_targets/fuzz_whir_agg_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_fips205_and_fts_decode"
path = "fuzz_targets/fuzz_fips205_and_fts_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_diff_hashes_and_ntt"
path = "fuzz_targets/fuzz_diff_hashes_and_ntt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_blind_vc_and_agg_decode"
path = "fuzz_targets/fuzz_blind_vc_and_agg_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_quorum_frames"
path = "fuzz_targets/fuzz_quorum_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_policy_tokens"
path = "fuzz_targets/fuzz_policy_tokens.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_cred_wire"
path = "fuzz_targets/fuzz_cred_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_hologram_and_subtree_decode"
path = "fuzz_targets/fuzz_hologram_and_subtree_decode.rs"
test = false
doc = false
bench = false
